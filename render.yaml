# Render Blueprint - HEXA Studio (static site, no build step)
# Deploy: https://dashboard.render.com/blueprints
# All JS/CSS deps are CDN-hosted; no package.json or bundler required.

services:
  - type: web
    name: hexa-studio
    runtime: static
    repo: https://github.com/amr-karam/hexa-studio.git
    branch: master
    rootDir: .
    staticPublishPath: .
    domains:
      - hermes.hexastudio.net
    envVars:
      - key: NODE_VERSION
        value: "20"
    headers:
      - path: /media/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /assets/tex*/**/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /assets/sky/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /CLIPS/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    routes:
      - type: rewrite
        source: /prompt
        destination: /prompt/index.html
      - type: rewrite
        source: /
        destination: /index.html
